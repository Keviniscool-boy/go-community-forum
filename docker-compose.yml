services:
  mysql8019:
    image: "mysql:8.0.19"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}"
      MYSQL_DATABASE: "bluebell"
      MYSQL_USER: "bluebell"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}"
    restart: unless-stopped
    ports:
      - "33061:3306"
    volumes:
      # 基线结构（旧版三张表）；邮箱/问答/互动等新结构由服务启动时的版本化迁移链补齐
      - ./models/create_table.sql:/docker-entrypoint-initdb.d/create_table.sql
      # 数据持久化：容器重建不丢数据
      - mysql_data:/var/lib/mysql

  redis507:
    image: "redis:7"
    restart: unless-stopped
    ports:
      - "26379:6379"
    volumes:
      # Redis AOF 持久化：验证码可丢（短 TTL），Feed 缓存可重建
      - redis_data:/data

  bluebell_app:
    build: .
    restart: unless-stopped
    environment:
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env}"
      MAIL_HOST: "${MAIL_HOST:-}"
      MAIL_PORT: "${MAIL_PORT:-465}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_FROM: "${MAIL_FROM:-}"
      MAIL_TLS: "${MAIL_TLS:-true}"
    command: ./wait-for.sh mysql8019:3306 redis507:6379 -- ./bluebell_app
    depends_on:
      - mysql8019
      - redis507
    ports:
      - "8888:8081"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - bluebell_app
    ports:
      - "8080:80"

volumes:
  mysql_data:
  redis_data:
