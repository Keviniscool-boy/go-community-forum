basePath: /api/v1
definitions:
  controller.AuthResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/models.AuthUser'
    type: object
  controller.LoginResponse:
    properties:
      token:
        type: string
    type: object
  controller.ResCode:
    enum:
    - 1000
    - 1001
    - 1002
    - 1003
    - 1004
    - 1005
    - 1006
    - 1007
    - 1008
    - 1009
    - 1010
    - 1011
    - 1012
    - 1013
    - 1014
    - 1015
    - 1016
    - 1017
    - 1018
    - 1019
    - 1020
    - 1021
    - 1022
    - 1023
    - 1024
    - 1025
    - 1026
    - 1027
    - 1028
    - 1029
    - 1030
    format: int64
    type: integer
    x-enum-varnames:
    - CodeSuccess
    - CodeInvalidParams
    - CodeUserExist
    - CodeUserNotExist
    - CodeInvalidCredentials
    - CodePasswordMismatch
    - CodeServerBusy
    - CodePostNotExist
    - CodeCommunityNotExist
    - CodeInvalidAuth
    - CodeNeedLogin
    - CodeVoteTimeExpire
    - CodeRepeatedVote
    - CodeEmailExist
    - CodeEmailNotExist
    - CodeSendTooFrequent
    - CodeVerifyCodeInvalid
    - CodeAccountBanned
    - CodeQuestionNotExist
    - CodeAnswerNotExist
    - CodeTopicExist
    - CodeRegisterFailed
    - CodeSendCodeFailed
    - CodeVerifyCodeLocked
    - CodeFeedRefreshing
    - CodeFeedExpired
    - CodeForbidden
    - CodeResetTokenInvalid
    - CodeEmailConflict
    - CodeDraftConflict
    - CodeCommentNotExist
  controller.Response:
    properties:
      code:
        $ref: '#/definitions/controller.ResCode'
      data: {}
      msg: {}
    type: object
  controller.eventRequest:
    properties:
      events:
        items:
          properties:
            event_id:
              description: 客户端去重 ID
              type: string
            event_type:
              type: string
            feed_type:
              type: string
            item_id:
              type: string
            item_type:
              type: string
            position:
              type: integer
          required:
          - event_type
          - item_id
          - item_type
          type: object
        maxItems: 50
        type: array
    required:
    - events
    type: object
  controller.previewRequest:
    properties:
