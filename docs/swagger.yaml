host: localhost:8081
info:
  contact:
    email: raotao29@gmail.com
    name: bluebell
    url: https://github.com/Keviniscool-boy?tab=repositories
  description: 基于 Gin + MySQL + Redis 的社区 Web 应用，提供用户、社区、帖子、投票等接口
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: bluebell 项目接口文档
  version: "1.0"
paths:
  /admin/audit-logs:
    get:
      description: 只追加的管理操作审计记录，cursor 分页
      parameters:
      - description: 游标
        in: query
        name: cursor
        type: string
      - description: 数量，默认 50，最大 100
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/controller.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.AuditLogPage'
              type: object
      security:
      - ApiKeyAuth: []
      summary: 审计日志
      tags:
      - 管理后台
  /admin/content/{type}/{id}/{action}:
    post:
      description: 对问题/回答执行 approve / reject / quarantine
      parameters:
      - description: question | answer
        in: path
        name: type
        required: true
        type: string
      - description: 内容 ID
        in: path
        name: id
        required: true
        type: integer
      - description: approve | reject | quarantine
        in: path
        name: action
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.Response'
      security:
      - ApiKeyAuth: []
      summary: 内容审核
      tags:
      - 管理后台
  /admin/metrics/overview:
    get:
      description: 用户/内容/举报/审计的计数总览
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/controller.Response'
            - properties:
                data:
                  additionalProperties: true
                  type: object
              type: object
      security:
      - ApiKeyAuth: []
      summary: 指标总览
      tags:
      - 管理后台
  /admin/reports:
    get:
      description: 管理员/审核员查看举报队列，cursor 分页
      parameters:
      - description: pending | resolved | dismissed，不传查全部
        in: query
        name: status
        type: string
      - description: 游标
        in: query
        name: cursor
        type: string
      - description: 数量，默认 50，最大 100
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/controller.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.ReportPage'
              type: object
      security:
      - ApiKeyAuth: []
      summary: 举报队列
      tags:
      - 管理后台
  /admin/reports/{id}/resolve:
    post:
      consumes:
      - application/json
      description: resolve 表示举报成立（内容隔离下架），dismiss 表示驳回；乐观锁防并发覆盖
      parameters:
      - description: 举报 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 处理决定
        in: body
        name: object
        required: true
        schema:
          $ref: '#/definitions/controller.resolveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.Response'
      security:
      - ApiKeyAuth: []
      summary: 处理举报
      tags:
      - 管理后台
  /admin/users/{id}/disable:
    post:
      consumes:
      - application/json
      description: 禁用后该用户全部会话立即失效
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 'enable: true 启用 / false 禁用'
        in: body
        name: object
        required: true
        schema:
          $ref: '#/definitions/controller.setEnableRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.Response'
      security:
      - ApiKeyAuth: []
      summary: 禁用/启用用户
      tags:
      - 管理后台
  /answers/{answer_id}:
    delete:
      description: 仅作者可删除，软删除后问题的回答数自动重算
      parameters:
      - description: 回答 ID
        in: path
        name: answer_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.Response'
      security:
      - ApiKeyAuth: []
      summary: 删除回答
      tags:
      - 问答相关接口
    put:
      consumes:
      - application/json
      description: 仅作者可编辑回答内容
      parameters:
      - description: 回答 ID
        in: path
