        maxLength: 20000
        type: string
    required:
    - markdown
    type: object
  controller.resolveRequest:
    properties:
      decision:
        enum:
        - resolve
        - dismiss
        type: string
      note:
        maxLength: 1000
        type: string
    required:
    - decision
    type: object
  controller.setEnableRequest:
