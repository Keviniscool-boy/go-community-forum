name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    services:
      # 集成测试用真实 MySQL/Redis（迁移链、关注流分页、并发互动一致性）
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_test_root
        ports:
          - 33061:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pci_test_root"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 26379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (unit + integration)
        env:
          BB_TEST_MYSQL_DSN: 'root:ci_test_root@tcp(127.0.0.1:33061)/'
        run: go test ./...

  frontend:
    name: Frontend (Vue 3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare env
        run: |
          printf 'MYSQL_ROOT_PASSWORD=ci_root_pw\nMYSQL_PASSWORD=ci_app_pw\nJWT_SECRET=ci-secret-32-chars-minimum-abcdef\n' > .env

      - name: Start full stack
        run: docker compose up -d --build
        timeout-minutes: 15

      - name: Wait for backend ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8888/readyz > /dev/null; then echo ready; exit 0; fi
            sleep 2
          done
          echo "backend not ready"; docker compose logs bluebell_app; exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm install playwright@1.50.0 --no-save
          npx playwright install chromium

      - name: Run E2E
        working-directory: e2e
        env:
          BASE_URL: http://localhost:8081
          E2E_REDIS_CMD: docker exec go-community-forum_redis507-1 redis-cli
        run: |
          npx playwright test --reporter=list
          # CI 无 SMTP：e2e.spec.ts 从 Redis 注入验证码（E2E_REDIS_CMD）

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: e2e/test-results/
