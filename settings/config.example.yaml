app:
  name: "bluebell"
  mode: "dev"
  port: 8081
mysql:
  auto_migrate: true  # 启动时自动执行 models/migrations 迁移链
  host: "localhost"
  port: 3306
  user: "root"
  password: "replace-with-your-local-password"
  dbname: "bluebell"
log:
  level: "debug"
  mode: "dev"       # dev: 同时输出到文件和控制台 | prod: 仅输出到文件
  filename: "bluebell.log"
  max_size: 200
  max_age: 30
  max_backups: 7
redis:
  host: "localhost"
  port: 6379
  db: 0
snowflake:
  start_time: "2026-07-24 00:00:00"
  machine_id: 1
message:
  evidence_key: ""  # 64 位 hex AES-256 密钥（举报证据加密）；生产由部署环境注入
storage:
  local_root: "./uploads"  # 本地对象存储目录（生产替换 S3/MinIO）
jwt:
  secret: "replace-with-at-least-32-random-characters"
mail:
  host: "smtp.example.com"      # SMTP 服务器
  port: 465                     # 465 走隐式 TLS，587 走 STARTTLS
  username: "noreply@example.com"
  password: "replace-with-your-smtp-password"  # 不要提交真实密码，生产通过 .env 注入
  from: "noreply@example.com"
  tls: true