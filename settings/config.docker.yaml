app:
  name: "bluebell"
  mode: "dev"
  port: 8081
  # CI/容器环境放宽全局限流（e2e 连续 UI 流程会突发；生产建议默认 2s/100）
  rate_limit_fill_seconds: 1
  rate_limit_capacity: 1000
mysql:
  auto_migrate: true  # 启动时自动执行 models/migrations 迁移链
  host: "mysql8019"
  port: 3306
  user: "bluebell"
  password: ""
  dbname: "bluebell"
log:
  level: "debug"
  mode: "dev"
  filename: "bluebell.log"
  max_size: 200
  max_age: 30
  max_backups: 7
redis:
  host: "redis507"
  port: 6379
  db: 0
snowflake:
  start_time: "2026-07-24 00:00:00"
  machine_id: 1
message:
  evidence_key: ""  # 64 位 hex AES-256 密钥（举报证据加密）；生产由部署环境注入
storage:
  local_root: "./uploads"  # 本地对象存储目录（生产替换 S3/MinIO）
jwt:
  secret: ""
# 邮件配置通过环境变量注入（MAIL_HOST / MAIL_PORT / MAIL_USERNAME / MAIL_PASSWORD / MAIL_FROM / MAIL_TLS）
mail:
  host: ""
  port: 465
  username: ""
  password: ""
  from: ""
  tls: true
